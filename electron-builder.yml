appId: com.cloudtunnel.app
productName: Cloud Tunnel
directories:
  buildResources: resources
  output: release
publish:
  provider: github
  # Releases are created by `.github/workflows/release.yml` (not electron-builder).
  releaseType: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/cloudflared/${platform}-${arch}
    to: cloudflared
    filter:
      - '**/*'
  - from: resources/icons
    to: icons
    filter:
      - '**/*'
linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: resources/icons
win:
  target:
    - nsis
  icon: resources/icons/icon.png
mac:
  target:
    - dmg
  category: public.app-category.utilities
  icon: resources/icons/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
